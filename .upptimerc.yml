# Pad status page — https://status.getpad.dev
# Probes are public, unauthenticated endpoints only. There is no public probe for the
# database or for OAuth callbacks; the readiness check below covers the DB indirectly
# (it fails when the server cannot reach its store).
owner: PerpetualSoftware
repo: status

sites:
  - name: Web app
    url: https://app.getpad.dev
  - name: API
    url: https://app.getpad.dev/api/v1/health
  - name: API readiness (database)
    url: https://app.getpad.dev/api/v1/health/ready
  - name: Website
    url: https://www.getpad.dev
  - name: Stripe webhook endpoint
    url: https://app.getpad.dev/webhooks/stripe
    expectedStatusCodes:
      - 405

status-website:
  cname: status.getpad.dev
  name: Pad status
  introTitle: "Live status for **Pad** — the web app, API, and website."
  introMessage: Checks run every five minutes from GitHub Actions. Incidents open automatically as issues on the [status repository](https://github.com/PerpetualSoftware/status).
  navbar:
    - title: Status
      href: /
    - title: Pad
      href: https://www.getpad.dev
    - title: GitHub
      href: https://github.com/PerpetualSoftware/pad
